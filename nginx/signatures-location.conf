# Add to the Advanced configuration of the /signatures/ custom location.
# Forward that location to the C++ backend's host and port 8081.
# Keep /api/ forwarded to the backend without caching.
proxy_cache osrs_signatures;
proxy_cache_key "$scheme|$host|$request_uri";
proxy_cache_revalidate on;
proxy_cache_lock on;
proxy_cache_lock_timeout 95s;
proxy_cache_lock_age 95s;
proxy_read_timeout 95s;
proxy_cache_valid 200 60s;
proxy_cache_background_update off;
proxy_cache_use_stale off;
add_header X-Cache-Status $upstream_cache_status always;
